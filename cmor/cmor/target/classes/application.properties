spring.application.name=cmor
server.port=8080

# 💾 ALTERADO: Banco H2 salvo em arquivo local (Não reseta mais ao reiniciar!)
spring.datasource.url=jdbc:h2:file:./data/cmordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 🔄 ALTERADO: Hibernate configurado para 'update' (Apenas atualiza a estrutura sem apagar os dados)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 🖥️ Console H2 mantido no seu caminho original (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console